services:
  app:
    build:
      context: ../
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    volumes:
      - ../:/usr/src/app
    command: npm run dev
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: roadmapa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: